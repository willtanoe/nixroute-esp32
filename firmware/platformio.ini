; ESP32-WROOM-32 AI API Router — PlatformIO
[env:esp32dev]
platform = espressif32 @ 7.1.0
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
board_build.flash_mode = dio
board_build.fuses.flash_freq = 40m
; Partition: custom single-app large (no OTA) — 1.5MB app + spiffs, fits proxy with bundle
board_build.partitions = partitions.csv

; Build flags — keep heap lean, enable warnings
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DESP32_WROOM_32=1

; Extra sdkconfig defaults live in sdkconfig.defaults (Kconfig)
; Ensure dynamic mbedTLS, lowered httpd/wifi buffers, etc.

; For CI reproducibility: pin IDF component versions via sdkconfig.defaults
