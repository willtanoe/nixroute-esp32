<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Head panah di pojok kanan atas -->
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="2.5" refY="3" orient="auto">
      <path d="M 0 0 L 5 3 L 0 6 z" fill="#0c1a30"/>
    </marker>
  </defs>

  <!-- Pilar Kiri Huruf N -->
  <rect x="70" y="70" width="92" height="375" rx="46" fill="#0c1a30" />

  <!-- Pilar Kanan Huruf N -->
  <rect x="338" y="70" width="92" height="375" rx="46" fill="#0c1a30" />

  <!-- Panah kecil di puncak pilar kanan -->
  <path d="M 416 85 L 442 59 M 442 59 L 418 59 M 442 59 L 442 83" 
        fill="none" 
        stroke="#0c1a30" 
        stroke-width="15" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Garis Diagonal Luar Huruf N -->
  <line x1="125" y1="130" x2="375" y2="380" 
        stroke="#0c1a30" 
        stroke-width="96" 
        stroke-linecap="round" />

  <!-- Garis Lintasan Putih di Tengah Diagonal -->
  <line x1="125" y1="130" x2="375" y2="380" 
        stroke="#ffffff" 
        stroke-width="18" 
        stroke-linecap="round" />

  <!-- Node 1 (Kiri Atas) -->
  <circle cx="125" cy="130" r="34" fill="#0c1a30" stroke="#ffffff" stroke-width="14" />
  <circle cx="125" cy="130" r="16" fill="#00a8b5" />

  <!-- Node 2 (Tengah) -->
  <circle cx="250" cy="255" r="34" fill="#0c1a30" stroke="#ffffff" stroke-width="14" />
  <circle cx="250" cy="255" r="16" fill="#00a8b5" />

  <!-- Node 3 (Kanan Bawah) -->
  <circle cx="375" cy="380" r="34" fill="#0c1a30" stroke="#ffffff" stroke-width="14" />
  <circle cx="375" cy="380" r="16" fill="#00a8b5" />
</svg>
